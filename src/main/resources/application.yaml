ktor:
  application:
    modules:
      - me.soknight.minigram.chats.ApplicationKt.module
  deployment:
    port: 8080

chats:
  jwt:
    secret: "$JWT_SECRET"
    issuer: "${JWT_ISSUER:Minigram}"
    audience: "${JWT_AUDIENCE:MinigramClient}"
  services:
    profileUrl: "${PROFILE_SERVICE_URL:http://profile-service:5000}"
  database:
    url: "${DATABASE_URL:jdbc:h2:file:./data/chats;MODE=PostgreSQL}"
    driver: "${DATABASE_DRIVER:org.h2.Driver}"
    username: "${DATABASE_USERNAME:}"
    password: "${DATABASE_PASSWORD:}"
    maxPoolSize: "${DATABASE_MAX_POOL_SIZE:10}"
    minIdle: "${DATABASE_MIN_IDLE:2}"
